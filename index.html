<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Love Web</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    overflow-x: hidden;
    color: white;
}

/* ===== NỀN ===== */
body {
    background: linear-gradient(135deg, #ff9a9e, #ff4d88, #ffb6c1);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ===== MENU ===== */
.menu-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 30px;
    cursor: pointer;
    z-index: 1001;
}

.sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    width: 260px;
    height: 100%;
    background: rgba(255, 0, 102, 0.9);
    backdrop-filter: blur(10px);
    padding-top: 70px;
    transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
    z-index: 1000;
}

.sidebar.active {
    left: 0;
}

.sidebar a {
    display: block;
    padding: 15px 20px;
    color: white;
    text-decoration: none;
    font-size: 18px;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.2);
}

/* ===== CHÚ VỊT ĐỘI MŨ HEO (ĐÃ SỬA) ===== */
.duck {
    position: fixed; /* Chuyển thành fixed để không bị phụ thuộc vào chiều rộng sidebar */
    bottom: 20px;
    left: -60px; /* Đẩy hẳn sang trái, chỉ để lộ khoảng 60px đầu vịt khi đóng menu */
    width: 120px; /* Tăng kích thước to hơn (cũ là 95px) */
    height: auto;
    cursor: pointer;
    z-index: 1002; /* Đảm bảo nằm trên cả sidebar và nút menu */
    
    /* Trạng thái khi MENU ĐÓNG: Vịt ló nhẹ từ cạnh trái màn hình */
    transform: rotate(15deg);
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Khi MENU MỞ (.active) */
.sidebar.active ~ .duck, 
.sidebar.active .duck {
    left: 20px; /* Khi mở menu, vịt sẽ đi sâu vào trong màn hình (nằm trên sidebar) */
    animation: duckPopIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
              duckIdle 3s ease-in-out infinite 0.6s; 
}

/* Animation lúc vịt nhảy ra từ bên trái */
@keyframes duckPopIn {
    0% { transform: scale(0.6) rotate(-35deg); }
    70% { transform: scale(1.15) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
}

/* Animation chú vịt tự chuyển động lắc lư nhịp nhàng */
@keyframes duckIdle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
}

/* ===== CARD ===== */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: rgba(255,255,255,0.15);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

h1 { margin: 0; font-size: 32px; }

.sub {
    margin-top: 10px;
    opacity: 0.9;
}

.days {
    font-size: 28px;
    margin-top: 20px;
    font-weight: bold;
}

/* TIM */
.heart {
    position: fixed;
    color: #ff1a75;
    font-size: 18px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh);}
    100% {transform: translateY(-10vh);}
}

/* PAGE */
.page { display: none; }
.page.active { display: block; }

</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="sidebar">
    <a href="#" onclick="showPage('home')">💖 Ngày yêu nhau</a>
    <a href="#" onclick="showPage('birthday')">🎂 Sinh nhật</a>
    
    <img src="duck.png" alt="Duck" class="duck" onclick="toggleMenu()">
</div>

<div id="home" class="page active">
    <div class="container">
        <div class="card">
            <h1>Lê Quang Đại ❤️ Lê Thị Như Huỳnh</h1>
            <div class="sub">Hành trình yêu thương</div>
            <div class="days">
                <span id="dayCount">0</span> ngày bên nhau
            </div>
        </div>
    </div>
</div>

<div id="birthday" class="page">
    <div class="container">
        <div class="card">
            <h1>🎂 Sinh nhật</h1>
            <p>Lê Quang Đại: 19 - 11 - 2006</p>
            <p>Lê Thị Như Huỳnh: 17 - 03 - 2006</p>
        </div>
    </div>
</div>

<script>
function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("active");
}

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    toggleMenu();
}

/* NGÀY YÊU NHAU */
const startDate = new Date();
startDate.setDate(startDate.getDate() - 1629);

function updateDays() {
    const now = new Date();
    const diff = Math.floor((now - startDate) / (1000*60*60*24));
    document.getElementById("dayCount").innerText = diff;
}

updateDays();
setInterval(updateDays, 60000);

/* TIM BAY */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}

setInterval(createHeart,350);
</script>

</body>
</html>
