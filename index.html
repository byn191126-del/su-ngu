<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Love Web</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    overflow-x: hidden;
    color: white;
}

/* ===== NỀN ===== */
body {
    background: linear-gradient(135deg, #ff9a9e, #ff4d88, #ffb6c1);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ===== MENU ===== */
.menu-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 30px;
    cursor: pointer;
    z-index: 1001;
}

.sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    width: 260px;
    height: 100%;
    background: rgba(255, 0, 102, 0.9);
    backdrop-filter: blur(10px);
    padding-top: 70px;
    transition: 0.35s ease;
    z-index: 1000;
}

.sidebar.active {
    left: 0;
}

.sidebar a {
    display: block;
    padding: 15px 20px;
    color: white;
    text-decoration: none;
    font-size: 18px;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.2);
}

/* ===== VỊT LÓ ĐẦU ===== */
.duck {
    position: absolute;
    bottom: 25px;
    left: -40px;
    width: 90px;

    transform: translateX(-120px) scale(0.6);
    opacity: 0;
    transition: 0.4s ease;
}

.sidebar.active .duck {
    transform: translateX(0) scale(1);
    opacity: 1;
    animation: duckPeek 0.7s ease;
}

@keyframes duckPeek {
    0% {
        transform: translateX(-120px) scale(0.4) rotate(-10deg);
        opacity: 0;
    }
    60% {
        transform: translateX(10px) scale(1.2) rotate(8deg);
        opacity: 1;
    }
    100% {
        transform: translateX(0) scale(1) rotate(0deg);
    }
}

/* ===== CARD ===== */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: rgba(255,255,255,0.15);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

h1 { margin: 0; font-size: 32px; }

.sub {
    margin-top: 10px;
    opacity: 0.9;
}

.days {
    font-size: 28px;
    margin-top: 20px;
    font-weight: bold;
}

/* ===== TIM ===== */
.heart {
    position: fixed;
    color: #ff1a75;
    font-size: 18px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh) scale(1);}
    100% {transform: translateY(-10vh) scale(1.5);}
}

/* ===== PAGE ===== */
.page { display: none; }
.page.active { display: block; }

</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="sidebar">

    <a href="#" onclick="showPage('home')">💖 Ngày yêu nhau</a>
    <a href="#" onclick="showPage('birthday')">🎂 Sinh nhật</a>

    <!-- VỊT LÓ ĐẦU -->
    <img class="duck" src="https://i.imgur.com/8QfQx5T.png" alt="duck">

</div>

<!-- HOME -->
<div id="home" class="page active">
    <div class="container">
        <div class="card">
            <h1>Lê Quang Đại ❤️ Lê Thị Như Huỳnh</h1>
            <div class="sub">Hành trình yêu thương</div>
            <div class="days">
                <span id="dayCount">0</span> ngày bên nhau
            </div>
        </div>
    </div>
</div>

<!-- BIRTHDAY -->
<div id="birthday" class="page">
    <div class="container">
        <div class="card">
            <h1>🎂 Sinh nhật</h1>
            <p>Lê Quang Đại: 19 - 11 - 2006</p>
            <p>Lê Thị Như Huỳnh: 17 - 03 - 2006</p>
        </div>
    </div>
</div>

<script>
function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("active");
}

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    toggleMenu();
}

/* ===== NGÀY YÊU NHAU ===== */
const startDate = new Date();
startDate.setDate(startDate.getDate() - 1629);

function updateDays() {
    const now = new Date();
    const diff = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
    document.getElementById("dayCount").innerText = diff;
}

updateDays();
setInterval(updateDays, 60000);

/* ===== TIM BAY ===== */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (10 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}

setInterval(createHeart, 350);
</script>

</body>
</html>
